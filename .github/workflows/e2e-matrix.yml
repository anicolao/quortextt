name: Scheduled browser matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-browser-matrix
  cancel-in-progress: true

jobs:
  e2e-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fonts for consistent rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run scheduled browser and responsive smoke tests
        run: npm run test:e2e:matrix
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-browser-matrix-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
