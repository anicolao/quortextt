name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for checking changed files
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests with coverage
        run: npm run test:coverage -- --coverage.thresholds.lines=100 --coverage.thresholds.branches=95 --coverage.thresholds.functions=95 --coverage.thresholds.statements=95
      
      - name: Install fonts for consistent rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build and run production E2E tests
        run: npm run test:e2e:stories -- --update-snapshots=all
        env:
          CI: true
      
      - name: Enforce byte-exact visual expectations
        run: |
          visual_paths=(
            tests/e2e/snapshots/
            tests/e2e/user-stories/
            tests/e2e/screenshots/
          )

          if ! git diff --exit-code --quiet -- "${visual_paths[@]}"; then
            echo "Error: generated visual expectations differ byte-for-byte."
            git diff --name-only -- "${visual_paths[@]}"
            git diff --name-only -z -- "${visual_paths[@]}" | while IFS= read -r -d '' file; do
              destination="test-results/updated-expectations/$file"
              mkdir -p "$(dirname "$destination")"
              cp "$file" "$destination"
            done
            exit 1
          fi

      - name: Package tested immutable release
        run: npm run package:release

      - name: Upload immutable release
        uses: actions/upload-artifact@v4
        with:
          name: quortex-release-${{ github.sha }}
          path: release-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
            dist/version.json
            server/dist/version.json
            release-artifacts/
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-production.yml
    with:
      release-sha: ${{ github.sha }}
      artifact-name: quortex-release-${{ github.sha }}
    secrets: inherit
