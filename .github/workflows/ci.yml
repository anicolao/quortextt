name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for checking changed files
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests with coverage
        run: npm run test:coverage -- --coverage.thresholds.lines=100 --coverage.thresholds.branches=95 --coverage.thresholds.functions=95 --coverage.thresholds.statements=95
      
      - name: Install fonts for consistent rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build and run production E2E tests
        run: npm run test:e2e
        env:
          CI: true
      
      - name: Confirm narrative screenshots were not regenerated
        run: git diff --exit-code -- tests/e2e/user-stories/ tests/e2e/screenshots/
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
            dist/version.json
            server/dist/version.json
          retention-days: 7
